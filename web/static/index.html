<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klever Subscriber Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141432'/><path d='M10 7h4v7.5L20.5 7H25l-7.5 8.5L25 25h-4.5l-5.5-7.5V25H10V7z' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'><stop stop-color='%23EE3F71'/><stop offset='1' stop-color='%237D3FF1'/></linearGradient></defs></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EE3F71"/>
            <stop offset="1" stop-color="#7D3FF1"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="#141432"/>
        <path d="M10 7h4v7.5L20.5 7H25l-7.5 8.5L25 25h-4.5l-5.5-7.5V25H10V7z" fill="url(#logo-grad)"/>
      </svg>
      <h1><span class="brand-klever">Klever</span> <span class="brand-subscriber">Subscriber</span></h1>
    </div>
    <span id="status" class="badge disconnected">Disconnected</span>
  </header>
  <div class="header-gradient-line"></div>

  <section id="subscription-panel">
    <div class="panel-header">
      <span class="panel-title">Subscription</span>
      <div class="panel-actions">
        <button id="sub-add" class="btn-secondary" disabled>Add</button>
        <button id="sub-remove" class="btn-secondary" disabled>Remove</button>
        <button id="sub-apply" class="btn-apply" disabled>Replace All</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="sub-types">
        <label><input type="checkbox" name="sub-type" value="blocks"> blocks</label>
        <label><input type="checkbox" name="sub-type" value="transactions"> transactions</label>
        <label><input type="checkbox" name="sub-type" value="user_transactions"> user_transactions</label>
        <label><input type="checkbox" name="sub-type" value="accounts"> accounts</label>
      </div>
      <div class="sub-addresses">
        <input type="text" id="sub-addr" placeholder="Addresses (comma-separated)" spellcheck="false">
      </div>
    </div>
  </section>

  <section id="query-panel">
    <div class="panel-header">
      <span class="panel-title">Query</span>
      <div class="query-tabs">
        <button class="tab-btn active" data-tab="tx">Transaction</button>
        <button class="tab-btn" data-tab="block">Block</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="tab-tx" class="query-tab active">
        <div class="query-row">
          <input type="text" id="query-tx-hash" placeholder="Transaction hash" spellcheck="false">
          <label class="query-check"><input type="checkbox" id="query-tx-results"> withResults</label>
          <button id="query-tx-btn" class="btn-apply">Look up</button>
        </div>
      </div>
      <div id="tab-block" class="query-tab">
        <div class="query-row">
          <input type="number" id="query-block-nonce" placeholder="Nonce" min="0">
          <input type="text" id="query-block-hash" placeholder="Block hash" spellcheck="false">
          <label class="query-check"><input type="checkbox" id="query-block-txs"> withTxs</label>
          <button id="query-block-btn" class="btn-apply">Look up</button>
        </div>
      </div>
      <div id="query-result" class="query-result" style="display:none"></div>
    </div>
  </section>

  <section id="stats-bar">
    <div class="stat stat-highlight">
      <span class="stat-value" id="eps">0.0</span>
      <span class="stat-label">events / sec</span>
    </div>
    <div class="stat stat-highlight">
      <span class="stat-value" id="total">0</span>
      <span class="stat-label">total</span>
    </div>
    <div class="stat type-blocks">
      <span class="stat-value" id="count-blocks">0</span>
      <span class="stat-label">blocks</span>
    </div>
    <div class="stat type-transactions">
      <span class="stat-value" id="count-transactions">0</span>
      <span class="stat-label">transactions</span>
    </div>
    <div class="stat type-user_transactions">
      <span class="stat-value" id="count-user_transactions">0</span>
      <span class="stat-label">user txn</span>
    </div>
    <div class="stat type-accounts">
      <span class="stat-value" id="count-accounts">0</span>
      <span class="stat-label">accounts</span>
    </div>
  </section>

  <section id="filters">
    <span class="filter-label">Display</span>
    <label><input type="checkbox" value="blocks" checked> blocks</label>
    <label><input type="checkbox" value="transactions" checked> transactions</label>
    <label><input type="checkbox" value="user_transactions" checked> user_transactions</label>
    <label><input type="checkbox" value="accounts" checked> accounts</label>
  </section>

  <section id="events">
    <div id="event-list"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
